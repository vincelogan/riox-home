    margin:auto;
    animation:surge 1.4s ease-out both;

  .logo{
    width:min(74vw, 440px, 58vh);
    height:auto;
    display:block;
    user-select:none;

    height:1px;

  .mote{

    color:var(--dourado);
    text-transform:none;
  }
  .mote span{white-space:nowrap}
  .linkedin{
    margin-top:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:44px;
    height:44px;

  .linkedin svg{

    height:20px;
    display:block;
  }
  .linkedin:hover,
  .linkedin:focus-visible{
    opacity:.6;
    outline:none;
  }
  @media (prefers-reduced-motion: reduce){
    main{animation:none}
  }
